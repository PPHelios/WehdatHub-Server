# Runs the offline test suite (no live DB, WhatsApp or Gemini) on every pull request and on pushes to main.
# The browser pass (phone-size clicks through every search box, form and voice button) runs in its own job
# so the main run stays fast. Both use fake data and fake AI: no credits are spent.
# Logs are errors-only: failing tests and the last lines are printed; passing output is kept out of the log.
# A change that touches only docs or plan files runs neither job; any code change runs both in full.
name: tests

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run offline tests (errors only)
        run: |
          npm run test:ci > test.log 2>&1 || {
            grep -E '^(FAIL|  ●)' test.log | head -200
            echo '--- last 80 lines ---'
            tail -n 80 test.log
            exit 1
          }
          tail -n 5 test.log

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests (errors only)
        run: |
          npm run test:browser > browser.log 2>&1 || {
            grep -E '^(FAIL|  ●)' browser.log | head -200
            echo '--- last 80 lines ---'
            tail -n 80 browser.log
            exit 1
          }
          tail -n 5 browser.log
