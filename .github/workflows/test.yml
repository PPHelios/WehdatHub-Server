# Two levels of tests, all offline (fake data, fake AI, no live DB, WhatsApp or Gemini; no credits are spent):
# - fast (every push, about 3 minutes): the guard tests, the API and units, unit add/edit and search on the website, and the
#   main paths in a real browser (add a unit, a look-alike unit, a lost answer, no connection, edit, search).
# - full (about 8 minutes): the whole offline suite with the load tests, plus the browser pass when the web app or the code it
#   uses changed. It runs on every push to main, on a pull request that is not a draft, and by hand (Run workflow).
#   A pull request is merged only after the full run is green on its last commit: mark the draft "Ready for review" to start it.
# No automatic retries: a failure is fixed, never re-run until green.
# Logs are errors-only: failing tests and the last lines are printed; passing output is kept out of the log.
# A change that touches only docs or plan files runs nothing.
name: tests

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  # Runs on main are never cancelled, so every commit that lands on main keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.filter.outputs.browser }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Any doubt (no base, unreadable diff, force-push) means run the browser job.
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"; echo "no base commit: browser on"; exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null); then
            echo "browser=true" >> "$GITHUB_OUTPUT"; echo "diff unreadable: browser on"; exit 0
          fi
          if [ -z "$changed" ]; then
            echo "browser=true" >> "$GITHUB_OUTPUT"; echo "empty diff: browser on"; exit 0
          fi
          if echo "$changed" | grep -Eq '^(web/|routes/|domain/|services/|lib/|db/|scripts/|tests/|fonts/|package(-lock)?\.json|\.github/workflows/)'; then
            echo "browser=true" >> "$GITHUB_OUTPUT"
          else
            echo "browser=false" >> "$GITHUB_OUTPUT"
          fi

  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run fast tests (errors only)
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          npm run test:fast > fast.log 2>&1 || {
            grep -E '^(FAIL|not ok)|  ●|Error:|✕' fast.log | head -300
            echo '--- last 120 lines ---'
            tail -n 120 fast.log
            exit 1
          }
          tail -n 5 fast.log
      - run: npx playwright install --with-deps chromium
      - name: Run main paths in the browser (errors only)
        run: |
          npm run test:main-paths > main-paths.log 2>&1 || {
            grep -E '^(FAIL|not ok)|  ●|Error:|✕|Page says' main-paths.log | head -300
            echo '--- last 120 lines ---'
            tail -n 120 main-paths.log
            exit 1
          }
          tail -n 5 main-paths.log

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run offline tests (errors only)
        env:
          # Four test workers; each gets its own heap and is restarted when it grows past 1.5 GB.
          NODE_OPTIONS: --max-old-space-size=3072
        run: |
          npm run test:ci > test.log 2>&1 || {
            grep -E '^(FAIL|not ok)|  ●|Error:|✕' test.log | head -300
            echo '--- last 120 lines ---'
            tail -n 120 test.log
            exit 1
          }
          tail -n 5 test.log

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests (errors only)
        run: |
          npm run test:browser > browser.log 2>&1 || {
            grep -E '^(FAIL|not ok)|  ●|Error:|✕' browser.log | head -300
            echo '--- last 120 lines ---'
            tail -n 120 browser.log
            exit 1
          }
          tail -n 5 browser.log
