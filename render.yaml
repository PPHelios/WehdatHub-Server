# Render blueprint after the move to OCI + Coolify (see Dockerfile): Render only forwards the old
# https://wehdathub.onrender.com address (released app builds, links already sent) to https://wehdathub.com.
# It holds no secrets: no database, no bot token, so it can never take the Telegram webhook or write data.
# Delete this service once APP_MIN_VERSION forces the app build that talks to wehdathub.com directly.
services:
  - type: web
    name: aqarchat
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node scripts/render-forwarder.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: FORWARD_TO
        value: https://wehdathub.com
